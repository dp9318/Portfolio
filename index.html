<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Software engineering portfolio of Dipankar Kumar, showcasing application development, AI systems integration, and practical software projects." />
    <meta property="og:title" content="Dipankar Kumar — Software Engineer" />

    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#3A0F34" />
    <title>Dipankar Kumar — Software Engineer</title>
    <style>
      html, body {
        background-color: #3A0F34;
        color: #DDE3E8;
      }
    </style>
    <script>
      (function () {
        var storageKey = 'portfolio-theme';
        var theme = localStorage.getItem(storageKey);
        var root = document.documentElement;
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.removeAttribute('data-theme');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
