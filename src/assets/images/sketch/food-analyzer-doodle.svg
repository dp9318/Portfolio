<svg width="84" height="64" viewBox="0 0 84 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hand-drawn laboratory microscope doodle for AI Food Analyzer -->
  <!-- Microscope ocular eyepiece -->
  <path d="M 28 12 L 36 20" stroke="#2E2B27" stroke-width="3" stroke-linecap="round"/>
  <!-- Turret & body tube -->
  <path d="M 32 16 L 42 26 L 40 32 L 36 28 Z" stroke="#2E2B27" stroke-width="1.8" fill="#FAF8F2"/>
  <!-- Objective lens -->
  <path d="M 40 32 L 44 36" stroke="#E10600" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Curved arm -->
  <path d="M 33 22 C 20 25, 20 44, 30 48" stroke="#2E2B27" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Stage & Petri dish -->
  <line x1="38" y1="40" x2="56" y2="40" stroke="#2E2B27" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="47" cy="39" rx="8" ry="2.5" stroke="#E10600" stroke-width="1.5"/>
  <!-- Microscope base -->
  <path d="M 24 48 L 52 48" stroke="#2E2B27" stroke-width="3" stroke-linecap="round"/>
  <!-- AI bounding box crosshairs -->
  <rect x="58" y="16" width="20" height="20" stroke="#E10600" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="68" cy="26" r="3" stroke="#2E2B27" stroke-width="1.5"/>
</svg>
