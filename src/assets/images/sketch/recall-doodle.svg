  <path d="M 32 18 C 26 12, 16 14, 15 22 C 14 26, 17 29, 15 33 C 13 38, 16 44, 22 45 C 26 46, 29 44, 32 46" stroke="#2E2B27" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hemisphere lobe -->
  <path d="M 34 18 C 40 12, 50 14, 51 22 C 52 26, 49 29, 51 33 C 53 38, 50 44, 44 45 C 40 46, 37 44, 34 46" stroke="#2E2B27" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Central dividing sulcus -->
  <path d="M 33 16 C 34 24, 32 38, 33 46" stroke="#2E2B27" stroke-width="1.8" stroke-dasharray="3 2"/>
  <!-- Inner folds & neural synapses -->
  <path d="M 22 24 C 26 26, 28 22, 31 25" stroke="#54504A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 20 34 C 25 33, 27 37, 31 35" stroke="#54504A" stroke-width="1.5" stroke-linecap="round"/>
