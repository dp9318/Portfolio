  <path d="M 46 34 C 41 33, 39 37, 35 35" stroke="#54504A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Database persistence blocks (SQLite ledger) -->
  <rect x="56" y="24" width="22" height="7" rx="2" stroke="#2E2B27" stroke-width="1.8" fill="#FAF8F2"/>
  <rect x="56" y="33" width="22" height="7" rx="2" stroke="#2E2B27" stroke-width="1.8" fill="#FAF8F2"/>
  <rect x="56" y="42" width="22" height="7" rx="2" stroke="#E10600" stroke-width="1.8" fill="#FAF8F2"/>
  <path d="M 50 35 L 56 35" stroke="#E10600" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Pencil hatching shadow under database -->
  <line x1="59" y1="51" x2="77" y2="51" stroke="#54504A" stroke-width="1.2" stroke-dasharray="2 2"/>
</svg>
