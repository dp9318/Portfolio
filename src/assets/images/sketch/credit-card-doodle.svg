<svg width="84" height="64" viewBox="0 0 84 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hand-drawn credit card & rupee doodle for Indian Credit Card Analysis -->
  <rect x="14" y="20" width="46" height="30" rx="3" stroke="#2E2B27" stroke-width="2.2" fill="#FAF8F2"/>
  <!-- Magnetic stripe / chip -->
  <rect x="20" y="27" width="10" height="8" rx="1" stroke="#E10600" stroke-width="1.5" fill="#FAF8F2"/>
  <!-- Card dots / digits -->
  <line x1="20" y1="42" x2="48" y2="42" stroke="#54504A" stroke-width="1.8" stroke-dasharray="2 3"/>
  <!-- Indian Rupee symbol doodle on the right -->
  <path d="M 65 22 L 77 22 M 65 26 L 75 26 M 68 22 C 73 22, 74 32, 68 32 L 76 44" stroke="#E10600" stroke-width="2.2" stroke-linecap="round"/>
</svg>
